<html lang="en">
<head>

  <title>Satoshi Nakamoto Statues – Global Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 20px;
      z-index: 1000;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #f7931a;
    }
    header p {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 4px;
    }
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #map {
      flex: 1;
      height: 100%;
      background: #0d1117;
    }
    .sidebar {
      width: 360px;
      background: #161b22;
      border-left: 1px solid #30363d;
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar h2 {
      font-size: 1rem;
      margin-bottom: 14px;
      color: #f7931a;
    }
    .statue-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .statue-card:hover {
      border-color: #f7931a;
    }
    .statue-card h3 {
      font-size: 0.98rem;
      margin-bottom: 3px;
    }
    .statue-card .location {
      font-size: 0.82rem;
      color: #f7931a;
      margin-bottom: 4px;
    }
    .statue-card .meta {
      font-size: 0.78rem;
      color: #8b949e;
    }
    .statue-card .type {
      display: inline-block;
      font-size: 0.7rem;
      background: #21262d;
      color: #f7931a;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 7px;
    }
    .note {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 18px;
      line-height: 1.45;
    }
    .leaflet-popup-content-wrapper {
      background: #161b22;
      color: #e6edf3;
      border-radius: 10px;
      max-width: 330px;
    }
    .leaflet-popup-tip {
      background: #161b22;
    }
    .leaflet-popup-content {
      margin: 13px;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 4px 0;
      color: #f7931a;
      font-size: 1.08rem;
    }
    .popup-location {
      font-size: 0.88rem;
      color: #8b949e;
      margin-bottom: 10px;
    }
    .popup-img {
      width: 100%;
      max-height: 170px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 11px;
      border: 1px solid #30363d;
      background: #0d1117;
    }
    .popup-meta {
      font-size: 0.85rem;
      line-height: 1.5;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; max-height: 42vh; border-left: none; border-top: 1px solid #30363d; }
    }
  </style>
</head>

      </div>
    </div>
  </div>
